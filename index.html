<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Ты меня простишь?</title>
  <meta name="theme-color" content="#FF4F81" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg">
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <canvas id="confetti"></canvas>
    <header class="topbar">
      <div class="progress" id="progress" aria-label="Прогресс истории"></div>
      <button class="mute" id="mute" type="button" aria-label="Музыка">🔊</button>
    </header>
    <div class="secret hidden" id="secret">Система определила: ты просто вредничаешь 😏❤️</div>
    <div class="wrap">
      <section class="card" id="screen"></section>
    </div>
    <button class="btn-no hidden" id="no-float" type="button">Нет 😤</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
